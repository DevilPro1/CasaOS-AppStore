name: big-bear-pterodactyl-panel

services:

  app:
    container_name: pterodactyl-panel
    image: ghcr.io/pterodactyl/panel:v1.12.2
    restart: unless-stopped

    depends_on:
      - database
      - cache

    ports:
      - "1180:80"
      - "11443:443"

    volumes:
      - "/DATA/AppData/pterodactyl/var:/app/var"
      - "/DATA/AppData/pterodactyl/logs:/app/storage/logs"

    environment:
      APP_URL: "http://192.168.0.205:1180"
      APP_TIMEZONE: "Europe/Madrid"
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      APP_SERVICE_AUTHOR: "admin@local"

      # 🔑 IMPORTANTE (si no existe, el panel rompe cosas)
      APP_KEY: "base64:CHANGE_THIS_AFTER_FIRST_INSTALL"

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache

      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: "admIin#6676@2026"
      DB_CONNECTION: mariadb

      MAIL_DRIVER: log
      MAIL_FROM: admin@local

    networks:
      - ptero-net

  database:
    container_name: pterodactyl-db
    image: mariadb:10.11
    restart: unless-stopped

    command: --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: "admIin#6676@2026"
      MYSQL_ROOT_PASSWORD: "admIin#6676@2026"

    volumes:
      - "/DATA/AppData/pterodactyl/database:/var/lib/mysql"

    networks:
      - ptero-net

  cache:
    container_name: pterodactyl-redis
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - ptero-net

  wings:
    container_name: pterodactyl-wings
    image: ghcr.io/pterodactyl/wings:v1.11.13
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "2022:2022"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/pterodactyl:/var/lib/pterodactyl"
      - "/etc/pterodactyl:/etc/pterodactyl"

    networks:
      - ptero-net

networks:
  ptero-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64

  main: app

  description:
    en_us: Clean Pterodactyl Panel + Wings stack for CasaOS

  tagline:
    en_us: Pterodactyl Stack

  developer: pterodactyl

  author: DevilPro1

  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/pterodactyl.png

  title:
    en_us: Pterodactyl Panel

  category: Games

  port_map: "1180"