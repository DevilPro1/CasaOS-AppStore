name: big-bear-pterodactyl-panel

services:
  app:
    container_name: pterodactyl-panel
    image: ghcr.io/pterodactyl/panel:v1.12.2
    restart: unless-stopped

    depends_on:
      - database
      - cache

    ports:
      - "1180:80"

    volumes:
      - "/DATA/AppData/pterodactyl/var:/app/var"
      - "/DATA/AppData/pterodactyl/logs:/app/storage/logs"

    environment:
      APP_URL: "http://192.168.0.205:1180"

      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"

      APP_TIMEZONE: "Europe/Madrid"

      APP_SERVICE_AUTHOR: "admin@local"

      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"

      REDIS_HOST: "cache"

      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: "nikovps"
      DB_USERNAME: "niko_local"
      DB_PASSWORD: "nikOo#6A57@2026"
      DB_CONNECTION: "mariadb"

      MAIL_FROM: "admin@local"
      MAIL_DRIVER: "log"

    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 5

  database:
    container_name: pterodactyl-db
    image: mariadb:10.11
    restart: unless-stopped

    command: --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_DATABASE: "nikovps"
      MYSQL_USER: "niko_local"
      MYSQL_PASSWORD: "nikOo#6A57@2026"
      MYSQL_ROOT_PASSWORD: "nikOo#6A57@2026"

    volumes:
      - "/DATA/AppData/pterodactyl/database:/var/lib/mysql"

  cache:
    container_name: pterodactyl-redis
    image: redis:alpine
    restart: unless-stopped

x-casaos:
  architectures:
    - amd64

  main: app

  description:
    en_us: Pterodactyl Panel optimized for CasaOS

  tagline:
    en_us: Pterodactyl Panel

  developer: pterodactyl

  author: DevilPro1

  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/pterodactyl.png

  title:
    en_us: Pterodactyl Panel

  category: Games

  port_map: "1180"

